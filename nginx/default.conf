# ── Nginx config — baked into the frontend Docker image ───────────────────────
#
#  This file handles ALL traffic on port 80 inside the frontend container:
#    /        → serves React SPA static files (from /usr/share/nginx/html)
#    /api/    → proxies to backend Node.js container  (backend:3001)
#    /health  → nginx liveness probe
#
#  Works identically on:
#    • localhost Docker  (http://localhost:8080)
#    • EC2               (http://<EC2_IP>:8080)
#  No URL changes required — the browser always calls /api/* (relative path).

server {
    listen      80;
    server_name _;        # accept any hostname / IP

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-XSS-Protection       "1; mode=block"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/javascript application/json
                    application/xml+rss image/svg+xml;

    # ── API proxy → backend Node.js ────────────────────────────────────────────
    #  Must be declared BEFORE the / location so it matches first.
    location /api/ {
        proxy_pass            http://backend:3001;   # full URI forwarded as-is
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";

        client_max_body_size  5m;        # allow log file uploads

        # AI calls can take up to 60 s — give plenty of headroom
        proxy_read_timeout    65s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    65s;
    }

    # ── React SPA static files ─────────────────────────────────────────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;

        # Client-side routing: unknown paths fall back to index.html
        try_files  $uri $uri/ /index.html;
    }

    # No-cache for index.html (always fetch latest JS/CSS references)
    location = /index.html {
        root                /usr/share/nginx/html;
        add_header          Cache-Control "no-cache, no-store, must-revalidate";
        add_header          Pragma        "no-cache";
        add_header          Expires       "0";
    }

    # Long-term cache for hashed static assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        root        /usr/share/nginx/html;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Health probe ───────────────────────────────────────────────────────────
    location /health {
        access_log  off;
        return 200  "ok\n";
        add_header  Content-Type text/plain;
    }
}
