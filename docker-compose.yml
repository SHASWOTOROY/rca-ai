# ── RCA Intelligence Platform — Docker Compose ────────────────────────────────
#
#  Services:   db (PostgreSQL)  +  backend (Node.js API)  +  frontend (React + Nginx)
#
#  Architecture:
#    Browser → :8080 → [frontend nginx] → serves React SPA static files
#                                       → proxies /api/* to [backend:3001]
#                                       → [backend] → connects to [db:5432] container
#
#  ┌───────────────────────────────────────────────────────────┐
#  │  LOCAL DEV (npm run dev)    │  DOCKER (compose up)        │
#  │  Frontend: localhost:5173   │  Frontend: localhost:8080   │
#  │  Backend:  localhost:3001   │  Backend:  internal only    │
#  │  Postgres: localhost:5432   │  Postgres: db container     │
#  │  Vite proxy /api → :3001   │  Nginx proxy /api → backend │
#  └───────────────────────────────────────────────────────────┘
#
#  Before first run:
#    1. Copy  backend/.env.example  →  backend/.env
#    2. Fill in OPENAI_API_KEY in backend/.env
#    3. (EC2 only) Change APP_URL below to your EC2 public IP/domain
#
#  Commands:
#    docker compose up --build -d       # build images and start
#    docker compose logs -f backend     # tail backend logs
#    docker compose down                # stop containers
#    docker compose down -v             # stop + wipe DB volume

services:

  # ── Database — PostgreSQL 16 ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rca_db
    restart: unless-stopped

    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB:       rca_project

    volumes:
      - pgdata:/var/lib/postgresql/data

    expose:
      - "5432"

    networks:
      - rca_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rca_project"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── Backend — Node.js 22 / Express ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: rca_backend:latest
    container_name: rca_backend
    restart: unless-stopped

    env_file:
      - backend/.env

    environment:
      NODE_ENV:   production
      PORT:       "3001"

      # ── Change this to your EC2 public IP or domain ───────────────────────
      #    Local:  http://localhost:8080
      #    EC2:    http://<YOUR_EC2_PUBLIC_IP>:8080
      APP_URL: "http://localhost:8080"

      # ── Postgres — points to the db container above ───────────────────────
      PGHOST:     db
      PGPORT:     "5432"
      PGUSER:     postgres
      PGPASSWORD: "1234"
      PGDATABASE: rca_project

    expose:
      - "3001"

    networks:
      - rca_net

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── Frontend — React SPA (built by Vite) + Nginx reverse proxy ──────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: rca_frontend:latest
    container_name: rca_frontend
    restart: unless-stopped

    ports:
      # ── THE SINGLE ENTRY POINT FOR ALL TRAFFIC ────────────────────────────
      #    Local:  http://localhost:8080
      #    EC2:    http://<EC2_PUBLIC_IP>:8080
      #            Open port 8080 in EC2 Security Group inbound rules.
      - "8080:80"

    networks:
      - rca_net

    depends_on:
      # service_started (not service_healthy) — frontend nginx can start
      # immediately; it will keep retrying /api/ calls until backend is ready.
      backend:
        condition: service_started

volumes:
  pgdata:
    driver: local
    name: rca_pgdata

networks:
  rca_net:
    driver: bridge
